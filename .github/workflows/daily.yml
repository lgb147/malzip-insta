# 매일 밤 10시(한국 시간)에 카드를 만들고 인스타그램에 올린다.
# 이 폴더(insta)의 내용을 공개 GitHub 저장소의 맨 위에 올려야 동작한다.
# 저장소 Settings → Secrets and variables → Actions 에 IG_USER_ID, IG_TOKEN 을 등록한다.
name: daily-post
on:
  schedule:
    - cron: "0 13 * * *"  # UTC 13:00 = 한국 시간 22:00
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

# 수동 실행과 예약 실행이 겹치면 하나씩 차례로 돌린다.
concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 이미 올렸는지 확인
        id: check
        run: |
          if [ -f "out/$(date +%Y-%m-%d)/posted" ]; then echo "오늘은 이미 올렸습니다. 건너뜁니다."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: 카드와 캡션 만들기
        id: make
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick jq fonts-noto-cjk
          chmod +x make.sh upload.sh
          echo "dir=$(./make.sh)" >> "$GITHUB_OUTPUT"

      - name: 이미지를 저장소에 올려 공개 주소 만들기
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "malzip-bot"
          git config user.email "malzip-bot@users.noreply.github.com"
          git add out
          git commit -m "cards: ${{ steps.make.outputs.dir }}" || echo "바뀐 카드 없음"
          git push
          sleep 60

      - name: 인스타그램에 게시
        if: steps.check.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.make.outputs.dir }}
        run: |
          ./upload.sh "${{ steps.make.outputs.dir }}"
          # 게시에 성공했을 때만 표시를 남겨서, 같은 날 두 번 올라가지 않게 한다.
          date > "${{ steps.make.outputs.dir }}/posted"
          git add out
          git commit -m "posted: ${{ steps.make.outputs.dir }}"
          git push
